[package]
name = "assemblelink"
version = "0.1.0"
description = "Local-first Atlas Systems workstation bootstrap"
authors = ["Atlas Systems"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
sha2 = "0.10"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
